<!doctype html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin panel</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
          crossorigin="anonymous">
</head>
<body>
<div class="container mt-4">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3 class="m-0">All Users</h3>

        <div class="d-flex gap-2">
            <button class="btn btn-success" type="button" id="add-user-btn">New User</button>

            <form th:action="@{/logout}" method="post" class="m-0">
                <input type="hidden"
                       th:name="${_csrf.parameterName}"
                       th:value="${_csrf.token}"/>

                <button type="submit" class="btn btn-outline-secondary">
                    Logout
                </button>
            </form>
        </div>
    </div>

    <div class="card">
        <div class="card-header">All Users</div>
        <div class="card-body p-0">
            <table class="table table-striped table-hover table-bordered m-0 align-middle">
                <thead class="table-light">
                <tr>
                    <th>ID</th>
                    <th>First name</th>
                    <th>Last name</th>
                    <th>Age</th>
                    <th>Email</th>
                    <th>Roles</th>
                    <th style="width: 180px;">Actions</th>
                </tr>
                </thead>

                <tbody id="users-table-body">
                </tbody>
            </table>
        </div>
    </div>

    <div class="modal fade" id="addUserModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Add user</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"
                            aria-label="Close"></button>
                </div>
                <div class="modal-body">

                    <form id="add-user-form" class="row g-3" novalidate>
                        <div class="col-md-6">
                            <label class="form-label">First name</label>
                            <input class="form-control"
                                   name="firstName"
                                   required>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">Last name</label>
                            <input class="form-control"
                                   name="lastName"
                                   required>
                        </div>

                        <div class="col-md-4">
                            <label class="form-label">Age</label>
                            <input class="form-control"
                                   name="age"
                                   type="number"
                                   min="1" max="150"
                                   required>
                        </div>

                        <div class="col-md-8">
                            <label class="form-label">Email</label>
                            <input class="form-control"
                                   type="email"
                                   name="email"
                                   required>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">Password</label>
                            <input class="form-control"
                                   type="password"
                                   name="password"
                                   required>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label d-block">Roles</label>
                            <select class="form-select"
                                    name="roleIds"
                                    id="add-roleIds"
                                    multiple
                                    size="2"
                                    required>
                                <option th:each="r: ${roles}"
                                        th:value="${r.id}"
                                        th:text="${r.name}">
                                    ROLE_USER
                                </option>
                            </select>
                            <div class="form-text">
                                Удерживайте Cmd/Ctrl, чтобы выбрать несколько
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button"
                            class="btn btn-secondary"
                            data-bs-dismiss="modal">Cancel</button>
                    <button type="button"
                            class="btn btn-primary"
                            id="add-save-btn">Save</button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="editUserModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Edit user</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"
                            aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="edit-user-form">
                        <input type="hidden" id="edit-id"/>

                        <div class="mb-3">
                            <label for="edit-firstName" class="form-label">First name</label>
                            <input type="text" class="form-control" id="edit-firstName">
                        </div>

                        <div class="mb-3">
                            <label for="edit-lastName" class="form-label">Last name</label>
                            <input type="text" class="form-control" id="edit-lastName">
                        </div>

                        <div class="mb-3">
                            <label for="edit-age" class="form-label">Age</label>
                            <input type="number" class="form-control" id="edit-age">
                        </div>

                        <div class="mb-3">
                            <label for="edit-email" class="form-label">Email</label>
                            <input type="email" class="form-control" id="edit-email">
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button"
                            class="btn btn-secondary"
                            data-bs-dismiss="modal">Cancel</button>
                    <button type="button"
                            class="btn btn-primary"
                            id="edit-save-btn">Save</button>
                </div>
            </div>
        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>

<script th:src="@{/js/admin.js}"></script>
</body>
</html>
