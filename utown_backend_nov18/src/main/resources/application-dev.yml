spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/utown_backend_nov18?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:spring}
    password: ${DB_PASSWORD:springpass}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

app:
  cors:
    allowed-origins: "http://localhost:3000,http://localhost:5173,http://localhost:8080"

  jwt:
    secret: "dev-super-secret-key-for-utown-backend-1234567890-VERY-LONG-AND-SAFE"
    expiration-ms: 86400000

server:
  port: 8080

logging:
  level:
    root: INFO
    org.example.utown_backend_nov18: DEBUG
